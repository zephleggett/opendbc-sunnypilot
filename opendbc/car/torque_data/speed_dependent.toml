# Speed-dependent torque parameters — per-car speed-binned config.
#
# Each entry maps a car fingerprint to breakpoints for np.interp():
#   speed_bp    — speed breakpoints in m/s (bin centers)
#   laf_bp      — initial latAccelFactor at each speed (closure starting point)
#   friction_bp — initial friction at each speed (closure starting point)
#
# The online learner in torqued.py discovers the per-speed curve from these
# starting values. laf_bp/friction_bp also define the sanity bounds (±30%).
#
# Starting from CX9_2021 crowd-sourced baseline (LAF=1.76, friction=0.177).
# Offline analysis (107K frames) showed LAF varies 1.10-2.89 across speed —
# the learner will converge toward those values within the ±30% bounds.

[MAZDA_CX5_2022]
speed_bp    = [5.5, 11.0, 17.0, 23.0, 33.0]
laf_bp      = [1.76, 1.76, 1.76, 1.76, 1.76]
friction_bp = [0.177, 0.177, 0.177, 0.177, 0.177]
